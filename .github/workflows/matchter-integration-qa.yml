name: MATCHTER integration QA
on:
  pull_request:
    branches:
      - fix/reciprocal-fee-status-popovers
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: matchter-qa-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/payment-mode-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: matchter_qa
          POSTGRES_PASSWORD: qa_local_only
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U postgres -d matchter_qa" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Existing beta build, test suites and smoke checks
        run: node scripts/build-demo.cjs
      - name: Dependency security inventory (diagnostic, no secrets)
        if: always()
        run: |
          for scope in all runtime; do
            flags=()
            if [ "$scope" = runtime ]; then flags+=(--omit=dev); fi
            npm audit --json "${flags[@]}" > "/tmp/matchter-audit-$scope.json" || true
            node -e 'const fs=require("fs");const a=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(a.error||!a.metadata){console.log("AUDIT_UNAVAILABLE",process.argv[2]);process.exit(0)};console.log("AUDIT_SCOPE",process.argv[2],JSON.stringify(a.metadata.vulnerabilities));for(const [name,v] of Object.entries(a.vulnerabilities||{})){console.log("AUDIT_DEP",JSON.stringify({name,severity:v.severity,isDirect:v.isDirect,range:v.range,fixAvailable:v.fixAvailable,nodes:v.nodes,via:v.via.map(x=>typeof x==="string"?x:{source:x.source,title:x.title,url:x.url,range:x.range})}))}' "/tmp/matchter-audit-$scope.json" "$scope"
          done
      - name: Authenticated API and real isolated PostgreSQL
        env:
          MATCHTER_EPHEMERAL_QA: 'true'
        run: node scripts/qa-authenticated-db.mjs
