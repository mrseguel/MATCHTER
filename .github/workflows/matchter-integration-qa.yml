name: MATCHTER integration QA
on:
  pull_request:
    branches:
      - fix/reciprocal-fee-status-popovers
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: matchter-qa-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/payment-mode-foundation'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Existing beta build, test suites and smoke checks
        run: node scripts/build-demo.cjs
