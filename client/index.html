<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>MATCHTER</title>
<style>
html,body{margin:0;background:#fff}
#matchter-startup{position:fixed;inset:0;z-index:2147483647;display:grid;place-items:center;background:#fff;color:#ff6900;opacity:1;transition:opacity 160ms ease;pointer-events:auto}
#matchter-startup span{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:30px;font-weight:800;letter-spacing:-1.15px;line-height:1.1}
#matchter-startup.is-ready{opacity:0;pointer-events:none}
@media(prefers-reduced-motion:reduce){#matchter-startup{transition:none}}
</style>
<link rel="stylesheet" href="/matchter-welcome.css">
</head>
<body>
<div id="matchter-startup" role="status"><span>Matchter</span></div>
<div id="root"></div>
<script>
(function(){
var root=document.getElementById('root'), splash=document.getElementById('matchter-startup'), scheduled=false;
function reveal(){
 if(scheduled||!root.firstElementChild)return;
 scheduled=true;observer.disconnect();
 requestAnimationFrame(function(){requestAnimationFrame(function(){
  splash.classList.add('is-ready');splash.setAttribute('aria-hidden','true');
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){splash.remove();return}
  splash.addEventListener('transitionend',function(){splash.remove()},{once:true});
  setTimeout(function(){splash.remove()},250);
 })});
}
var observer=new MutationObserver(reveal);observer.observe(root,{childList:true,subtree:true});reveal();
})();
</script>
<script type="module" src="/src/main.jsx"></script>
<script defer src="/matchter-welcome.js"></script>
</body>
</html>
